[preview]
revision_command = [
  "show",
  "--color",
  "always",
  "-r",
  "$change_id",
  "--tool",
  ":color-words",
]
file_command = [
  "diff",
  "--color",
  "always",
  "-r",
  "$change_id",
  "$file",
  "--tool",
  ":color-words",
]
show_at_start = true

[ui.colors]
"selected" = { bg = "#373B41" }
"revisions details selected" = { bg = "#373B41" }

[revisions]
revset = "present(@) | ancestors(immutable_heads().., 10) | present(trunk())"

[ui.tracer]
enabled = true
