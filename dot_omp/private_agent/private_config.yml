symbolPreset: nerd
theme:
  dark: tomorrow-night
  light: light
setupVersion: 3
statusLine:
  preset: nerd
  leftSegments:
    - model
    - mode
    - path
    - pr
    - session
    - subagents
  rightSegments:
    - session_name
    - token_in
    - token_out
    - cache_read
    - cache_write
    - token_rate
    - cost
    - context_pct
    - context_total
    - time_spent
    - time
display:
  showTokenUsage: true
  cacheMissMarker: true
  subagentLivePreview: false
task:
  showResolvedModelBadge: true
  eager: default
  isolation:
    enabled: true
defaultThinkingLevel: auto
secrets:
  enabled: true
github:
  enabled: true
showHardwareCursor: false
tools: {}
mcp: {}
hideThinkingBlock: false
browser:
  headless: true
  relay: false
steeringMode: one-at-a-time
followUpMode: one-at-a-time
interruptMode: immediate
compaction:
  methodOrder:
    - snapcompact
    - remote
    - soft
plan:
  defaultOnStartup: true
  autosave: true
features:
  unexpectedStopDetection: smart
terminal:
  showProgress: true
power:
  sleepPrevention: system
memory:
  backend: mnemopi
mnemopi:
  scoping: per-project-tagged
readLineNumbers: true
dev:
  autoqaConsent: denied
composer:
  shape: box
  tokenRate: true
astGrep:
  enabled: true
isolation:
  backend: auto
tui:
  vimMode: true
  vimModeDisplay: text
  mouse: false
  titleSpinner: braille
retry:
  maxRetries: 3
update:
  auto: false
